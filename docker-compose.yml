services:
  # PHP Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: laravel-app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: prod
      APP_ENV: local
      APP_DEBUG: "true"
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - laravel-network

  # Nginx Web Server
  web:
    image: nginx:stable-alpine
    container_name: laravel-web
    restart: unless-stopped
    tty: true
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/laravel.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel-network

  # MySQL Database
  db:
    image: mysql:9.0
    container_name: laravel-db
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-laravel_password}
      MYSQL_USER: ${DB_USERNAME:-laravel_user}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - laravel-network

  # Queue Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: laravel-worker
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=360
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - db
      - app
    networks:
      - laravel-network

networks:
  laravel-network:
    driver: bridge

volumes:
  db-data:
    driver: local
